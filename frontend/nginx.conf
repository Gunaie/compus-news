user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
                                '"remote_addr":"$remote_addr","method":"$request_method",'
                                '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"upstream_duration":"$upstream_response_time",'
                                '"upstream_status":"$upstream_status"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        add_header X-Request-ID $request_id always;

        location /api/ {
            proxy_pass http://backend:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /assets/ {
            proxy_pass http://frontend:5175;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Request-ID $request_id always;
        }

        location = /healthz {
            access_log off;
            proxy_pass http://frontend:5175;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://frontend:5175;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
